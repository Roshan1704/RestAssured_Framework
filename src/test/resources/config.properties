# API Configuration
base.uri=https://reqres.in
base.path=/api
environment=QA

# Request Configuration
request.timeout=30000
connection.timeout=10000
enable.logging=true

# Retry Configuration
retry.count=2
retry.enabled=true

# Reporting Configuration
extent.report.path=extent-reports/
allure.results.path=target/allure-results
screenshots.enabled=true

# Database Configuration (Optional)
db.url=jdbc:mysql://localhost:3306/testdb
db.username=root
db.password=root
db.driver=com.mysql.cj.jdbc.Driver

# Test Data Configuration
test.data.excel.path=src/test/resources/testdata/testdata.xlsx
test.data.json.path=src/test/resources/testdata/users.json
test.data.yaml.path=src/test/resources/testdata/config.yml
